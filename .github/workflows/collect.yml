# Collecte Open-Meteo -> Supabase, 3 fois par jour (heures en UTC)
name: collect

on:
  schedule:
    - cron: "0 4,11,17 * * *"
  workflow_dispatch:   # bouton "Run workflow" dans l'onglet Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_sheets.py
        env:
          GID_SPOT_PROPERTIES: ${{ vars.GID_SPOT_PROPERTIES }}
          GID_SPOT_CONDITIONS: ${{ vars.GID_SPOT_CONDITIONS }}
          GID_LEVEL_CONDITIONS: ${{ vars.GID_LEVEL_CONDITIONS }}
      - run: python collect.py
      # Ne tourne que si la collecte a réussi
      - run: python score.py
