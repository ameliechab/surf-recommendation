# Google Sheet -> tables de référence Supabase, à lancer à la main après une modif du Sheet
name: sync-sheets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GID_SPOT_PROPERTIES: ${{ vars.GID_SPOT_PROPERTIES }}
      GID_SPOT_CONDITIONS: ${{ vars.GID_SPOT_CONDITIONS }}
      GID_LEVEL_CONDITIONS: ${{ vars.GID_LEVEL_CONDITIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_sheets.py
